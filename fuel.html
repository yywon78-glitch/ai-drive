<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>주유 — 스마트 차계부</title>
<link rel="stylesheet" href="shared.css?v=1">
</head>
<body>
<div class="page">

  <header class="hdr">
    <span class="hdr-t">⛽ 주유 기록</span>
    <select class="v-sel-light" id="vsel" onchange="onVehicleChange('vsel')"></select>
  </header>

  <div class="segtabs" id="segtabs">
    <button class="segtab on" onclick="switchTab('list',this)">📋 현황</button>
    <button class="segtab" onclick="switchTab('input',this)">＋ 입력</button>
  </div>
  <div class="period-filter" id="periodBar">
    <button class="pf-btn on" onclick="setPeriod(1,this)">이번달</button>
    <button class="pf-btn" onclick="setPeriod(3,this)">3개월</button>
    <button class="pf-btn" onclick="setPeriod(6,this)">6개월</button>
    <button class="pf-btn" onclick="setPeriod(12,this)">1년</button>
    <button class="pf-btn" onclick="setPeriod(0,this)">전체</button>
  </div>

  <!-- 입력 탭 -->
  <div class="body" id="pane-input" style="display:none">
    <div class="bp">
      <div class="m-card form">
        <!-- 영수증 스캔 -->
        <div style="display:flex;align-items:center;gap:10px;">
          <label style="display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:9px;background:#f0fdf4;border:1.5px solid #bbf7d0;color:#15803d;font-size:13px;font-weight:700;cursor:pointer;">
            📷 영수증 스캔
            <input id="f_scan" type="file" accept="image/*" capture="environment" style="display:none" onchange="onFuelScan(event)">
          </label>
          <span id="f_scan_status" style="font-size:12px;color:var(--t3);"></span>
        </div>
        <div id="f_receipt_thumb" style="display:none;margin:-4px 0;"><img id="f_receipt_img" style="width:100%;max-height:140px;object-fit:contain;border-radius:8px;border:1px solid var(--bdr);"></div>
        <div class="m-row">
          <div class="m-group">
            <label class="m-label">날짜 *</label>
            <input type="date" class="m-input" id="f_date">
          </div>
          <div class="m-group">
            <label class="m-label">주행거리 (km) *</label>
            <input type="number" class="m-input" id="f_mileage" placeholder="66700" oninput="calcFuel()">
          </div>
        </div>
        <div class="m-row">
          <div class="m-group">
            <label class="m-label">주유량 (L) *</label>
            <input type="number" class="m-input" id="f_liters" placeholder="55.3" step="0.1" oninput="calcFuel()">
          </div>
          <div class="m-group">
            <label class="m-label">단가 (원/L) *</label>
            <input type="number" class="m-input" id="f_price" placeholder="1650" oninput="calcFuel()">
          </div>
        </div>
        <div class="m-row">
          <div class="m-group">
            <label class="m-label">금액 (자동계산)</label>
            <input type="text" class="m-input auto" id="f_amount" readonly placeholder="자동">
          </div>
          <div class="m-group">
            <label class="m-label">연비 (자동계산)</label>
            <input type="text" class="m-input auto" id="f_effic" readonly placeholder="자동">
          </div>
        </div>
        <div class="m-group">
          <label class="m-label">주유소</label>
          <input type="text" class="m-input" id="f_station" placeholder="선택 사항">
        </div>
        <button class="m-btn primary" onclick="saveFuel()">저장</button>
      </div>
    </div>
  </div>

  <!-- 현황 탭 -->
  <div class="body" id="pane-list">
    <div class="bp">
      <div class="m-card" id="fuelStat"></div>
      <div class="group-lbl" id="fuelListLbl">기록 목록</div>
      <div style="display:flex;flex-direction:column;gap:7px" id="fuelList"></div>
    </div>
  </div>

  <nav class="tabbar" id="tabbar"></nav>
</div>

<!-- 주유 수정 모달 -->
<div class="moverlay" id="modal-edit-fuel" onclick="if(event.target===this)closeEditFuel()">
  <div class="msheet">
    <div class="m-handle"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div class="m-title" style="margin-bottom:0">⛽ 주유 수정</div>
      <button onclick="deleteEditFuel()" style="background:#fef2f2;color:var(--red);border:1.5px solid #fecaca;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;">삭제</button>
    </div>
    <div class="m-body">
      <input type="hidden" id="ef_id">
      <div id="ef_receipt_thumb" style="display:none;margin-bottom:4px;"><img id="ef_receipt_img" style="width:100%;max-height:120px;object-fit:contain;border-radius:8px;border:1px solid var(--bdr);"></div>
      <div class="m-row">
        <div class="m-group"><label class="m-label">날짜 *</label><input type="date" class="m-input" id="ef_date"></div>
        <div class="m-group"><label class="m-label">주행거리 (km)</label><input type="number" class="m-input" id="ef_mileage"></div>
      </div>
      <div class="m-row">
        <div class="m-group"><label class="m-label">주유량 (L)</label><input type="number" class="m-input" id="ef_liters" step="0.1"></div>
        <div class="m-group"><label class="m-label">단가 (원/L)</label><input type="number" class="m-input" id="ef_price"></div>
      </div>
      <div class="m-group"><label class="m-label">주유소</label><input type="text" class="m-input" id="ef_station"></div>
      <button class="m-btn-primary" onclick="saveFuelEdit()">저장</button>
    </div>
  </div>
</div>

<script src="data.js?v=1"></script>
<script src="nav.js?v=1"></script>
<script>
renderTabBar('fuel');
renderVehicleSelect('vsel');
setToday('f_date');
prefillMileage();

let _fuelMonths = 1;
function setPeriod(mo, el) {
  _fuelMonths = mo;
  document.querySelectorAll('.pf-btn').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  renderList();
}
function _filtered() {
  const recs = getRecs('fuel');
  if (!_fuelMonths) return recs;
  const c = new Date(); c.setMonth(c.getMonth() - _fuelMonths); c.setDate(1); c.setHours(0,0,0,0);
  return recs.filter(r => new Date(r.date) >= c);
}

renderList();

let _fuelScanData = null; /* 스캔된 이미지 dataUrl */

async function onFuelScan(e) {
  const file = e.target.files[0]; if (!file) return;
  const st = document.getElementById('f_scan_status');
  st.textContent = '🔍 인식 중...';
  const reader = new FileReader();
  reader.onload = async ev => {
    const dataUrl = ev.target.result;
    _fuelScanData = dataUrl;
    /* 썸네일 표시 */
    document.getElementById('f_receipt_img').src = dataUrl;
    document.getElementById('f_receipt_thumb').style.display = '';
    /* OCR */
    const result = await ocrReceipt(dataUrl, 'fuel');
    e.target.value = '';
    if (!result) { st.textContent = '❌ 인식 실패 — 직접 입력해주세요'; return; }
    if (result.date)         document.getElementById('f_date').value    = result.date;
    if (result.liters)       document.getElementById('f_liters').value  = result.liters;
    if (result.pricePerLiter)document.getElementById('f_price').value   = result.pricePerLiter;
    if (result.station)      document.getElementById('f_station').value = result.station;
    calcFuel();
    st.textContent = '✅ 인식 완료 — 확인 후 저장하세요';
  };
  reader.readAsDataURL(file);
}

function prefillMileage() {
  const fuel = getRecs('fuel');
  if (fuel.length && fuel[0].mileage) {
    // 이전 최고 주행거리 미리채움 안 함 (입력 혼동 방지, 플레이스홀더만)
  }
}

function switchTab(id, el) {
  document.querySelectorAll('.segtab').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('pane-input').style.display = id === 'input' ? '' : 'none';
  document.getElementById('pane-list').style.display  = id === 'list'  ? '' : 'none';
  document.getElementById('periodBar').style.display  = id === 'list'  ? '' : 'none';
  if (id === 'list') renderList();
}

function calcFuel() {
  const L = +document.getElementById('f_liters').value;
  const P = +document.getElementById('f_price').value;
  const km = +document.getElementById('f_mileage').value;
  document.getElementById('f_amount').value = (L && P) ? numFmt(Math.round(L*P)) + '원' : '';
  const prev = getRecs('fuel');
  if (L && km && prev.length && prev[0].mileage) {
    const e = (km - prev[0].mileage) / L;
    document.getElementById('f_effic').value = e > 0 ? e.toFixed(1) + ' km/L' : '';
  } else {
    document.getElementById('f_effic').value = '';
  }
}

function saveFuel() {
  const date    = document.getElementById('f_date').value;
  const mileage = +document.getElementById('f_mileage').value;
  const liters  = +document.getElementById('f_liters').value;
  const price   = +document.getElementById('f_price').value;
  if (!date || !mileage || !liters || !price) {
    toast('날짜, 주행거리, 주유량, 단가를 입력해주세요');
    return;
  }
  const prev  = getRecs('fuel');
  const effic = prev.length && prev[0].mileage ? (mileage - prev[0].mileage) / liters : 0;
  addRec({
    id: DB.uid(), type:'fuel',
    date, mileage, liters, price,
    amount: Math.round(liters * price),
    effic: effic > 0 ? +effic.toFixed(2) : 0,
    station: document.getElementById('f_station').value.trim()
  });
  updateVehicleMileage(mileage);
  /* 영수증 이미지 저장 */
  const recId = recs[0]?.id;
  if (_fuelScanData && recId) ImgDB.set(recId, _fuelScanData).catch(()=>{});
  _fuelScanData = null;
  document.getElementById('f_receipt_thumb').style.display = 'none';
  document.getElementById('f_scan_status').textContent = '';
  ['f_mileage','f_liters','f_price','f_station','f_amount','f_effic'].forEach(id => document.getElementById(id).value = '');
  toast('주유 기록이 저장됐습니다 ✓');
  switchTab('list', document.querySelectorAll('.segtab')[0]);
}

function renderList() {
  const recs = _filtered();
  const totAmt = recs.reduce((s,r) => s+r.amount, 0);
  const totL   = recs.reduce((s,r) => s+r.liters, 0);
  const effs   = recs.filter(r => r.effic > 0);
  const avgE   = effs.length ? effs.reduce((s,r) => s+r.effic, 0) / effs.length : 0;

  document.getElementById('fuelStat').innerHTML = `
    <div class="m-row3" style="text-align:center">
      <div>
        <div class="d-label">총 주유비</div>
        <div class="d-value d-blue" style="font-size:17px">${numFmt(totAmt)}</div>
        <div class="d-unit">원</div>
      </div>
      <div>
        <div class="d-label">총 주유량</div>
        <div class="d-value d-sky" style="font-size:17px">${totL.toFixed(1)}</div>
        <div class="d-unit">L</div>
      </div>
      <div>
        <div class="d-label">평균 연비</div>
        <div class="d-value d-green" style="font-size:17px">${avgE ? avgE.toFixed(1) : '-'}</div>
        <div class="d-unit">km/L</div>
      </div>
    </div>`;

  const list = document.getElementById('fuelList');
  if (!recs.length) {
    list.innerHTML = `<div class="empty"><span class="empty-ic">⛽</span><div class="empty-t">주유 기록이 없습니다</div></div>`;
    return;
  }
  list.innerHTML = recs.map(r => `
    <div class="rec-row">
      <span class="rec-badge b-fuel">주유</span>
      <div class="rec-main">
        <div class="rec-title">${r.date} · ${numFmt(r.mileage)}km</div>
        <div class="rec-sub">${r.liters}L · ${numFmt(r.price)}원/L${r.effic>0?' · 연비 '+r.effic.toFixed(1)+'km/L':''}${r.station?' · '+r.station:''}</div>
      </div>
      <span class="rec-amt d-blue">${numFmt(r.amount)}원</span>
      <button class="rec-edit" onclick="openEditFuel('${r.id}')">수정</button>
    </div>`).join('');
}

function openEditFuel(id) {
  const r = getRecs('fuel').find(x => x.id === id); if (!r) return;
  document.getElementById('ef_id').value      = id;
  document.getElementById('ef_date').value    = r.date;
  document.getElementById('ef_mileage').value = r.mileage || '';
  document.getElementById('ef_liters').value  = r.liters  || '';
  document.getElementById('ef_price').value   = r.price   || '';
  document.getElementById('ef_station').value = r.station || '';
  /* 저장된 영수증 이미지 로드 */
  const thumb = document.getElementById('ef_receipt_thumb');
  const img   = document.getElementById('ef_receipt_img');
  ImgDB.get(id).then(data => {
    if (data) { img.src = data; thumb.style.display = ''; }
    else       { thumb.style.display = 'none'; }
  }).catch(()=>{ thumb.style.display = 'none'; });
  document.getElementById('modal-edit-fuel').classList.add('show');
}
function closeEditFuel() { document.getElementById('modal-edit-fuel').classList.remove('show'); }
function saveFuelEdit() {
  const id = document.getElementById('ef_id').value;
  const v  = getV(); if (!v) return;
  const k  = 'recs_' + v.id;
  const recs = DB.get(k, []);
  const idx  = recs.findIndex(x => x.id === id); if (idx < 0) return;
  const liters = +document.getElementById('ef_liters').value;
  const price  = +document.getElementById('ef_price').value;
  recs[idx] = { ...recs[idx],
    date:    document.getElementById('ef_date').value,
    mileage: +document.getElementById('ef_mileage').value || 0,
    liters, price,
    amount:  liters && price ? Math.round(liters * price) : recs[idx].amount,
    station: document.getElementById('ef_station').value.trim()
  };
  DB.set(k, recs);
  closeEditFuel(); renderList(); toast('수정됐습니다 ✓');
}
function deleteEditFuel() {
  delRec(document.getElementById('ef_id').value);
  closeEditFuel(); renderList(); toast('삭제됐습니다');
}

function render() {
  renderVehicleSelect('vsel');
  const activeTab = document.querySelector('.segtab.on');
  if (activeTab && activeTab.textContent.includes('현황')) renderList();
}
</script>
</body>
</html>
