<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>정비 — 스마트 차계부</title>
<link rel="stylesheet" href="shared.css?v=1">
</head>
<body>
<div class="page">

  <header class="hdr">
    <span class="hdr-t">🔧 정비 기록</span>
    <select class="v-sel-light" id="vsel" onchange="onVehicleChange('vsel')"></select>
  </header>

  <div class="segtabs">
    <button class="segtab on" onclick="switchTab('list',this)">📋 현황</button>
    <button class="segtab" onclick="switchTab('input',this)">＋ 입력</button>
  </div>
  <div class="period-filter" id="periodBar">
    <button class="pf-btn" onclick="setPeriod(1,this)">이번달</button>
    <button class="pf-btn" onclick="setPeriod(3,this)">3개월</button>
    <button class="pf-btn" onclick="setPeriod(6,this)">6개월</button>
    <button class="pf-btn" onclick="setPeriod(12,this)">1년</button>
    <button class="pf-btn on" onclick="setPeriod(0,this)">전체</button>
  </div>

  <!-- 입력 -->
  <div class="body" id="pane-input" style="display:none">
    <div class="bp">
      <div class="m-card form">
        <div style="display:flex;align-items:center;gap:10px;">
          <label style="display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:9px;background:#f0fdf4;border:1.5px solid #bbf7d0;color:#15803d;font-size:13px;font-weight:700;cursor:pointer;">
            📷 영수증 스캔
            <input id="m_scan" type="file" accept="image/*" capture="environment" style="display:none" onchange="onMaintScan(event)">
          </label>
          <span id="m_scan_status" style="font-size:12px;color:var(--t3);"></span>
        </div>
        <div id="m_receipt_thumb" style="display:none;margin:-4px 0;"><img id="m_receipt_img" style="width:100%;max-height:140px;object-fit:contain;border-radius:8px;border:1px solid var(--bdr);"></div>
        <div class="m-row">
          <div class="m-group">
            <label class="m-label">날짜 *</label>
            <input type="date" class="m-input" id="m_date" oninput="calcMaint()">
          </div>
          <div class="m-group">
            <label class="m-label">주행거리 (km)</label>
            <input type="number" class="m-input" id="m_mileage" placeholder="66700" oninput="calcMaint()">
          </div>
        </div>
        <div class="m-group">
          <label class="m-label">정비 항목 *</label>
          <select class="m-select" id="m_category" onchange="calcMaint()">
            <option value="">선택하세요</option>
            <option value="engine_oil">엔진오일 (합성유)</option>
            <option value="engine_oil_basic">엔진오일 (일반유)</option>
            <option value="air_filter">에어클리너</option>
            <option value="cabin_filter">에어컨 필터</option>
            <option value="tire_rotation">타이어 로테이션</option>
            <option value="tire_replace">타이어 교체</option>
            <option value="brake">브레이크 패드</option>
            <option value="coolant">냉각수</option>
            <option value="spark_plug">점화플러그</option>
            <option value="battery">배터리</option>
            <option value="exterior">외관 (세차/도색)</option>
            <option value="tax">세금/검사</option>
            <option value="other">기타</option>
          </select>
        </div>
        <div class="m-row">
          <div class="m-group">
            <label class="m-label">금액 (원) *</label>
            <input type="number" class="m-input" id="m_amount" placeholder="45000">
          </div>
          <div class="m-group">
            <label class="m-label">정비소</label>
            <input type="text" class="m-input" id="m_shop" placeholder="선택 사항">
          </div>
        </div>
        <div class="m-row">
          <div class="m-group">
            <label class="m-label">다음 예정일 (자동)</label>
            <input type="date" class="m-input auto" id="m_next_date">
          </div>
          <div class="m-group">
            <label class="m-label">다음 예정 km (자동)</label>
            <input type="number" class="m-input auto" id="m_next_km" placeholder="자동계산">
          </div>
        </div>
        <div class="m-group">
          <label class="m-label">메모</label>
          <input type="text" class="m-input" id="m_memo" placeholder="선택 사항">
        </div>
        <button class="m-btn primary" onclick="saveMaint()">저장</button>
      </div>
    </div>
  </div>

  <!-- 현황 -->
  <div class="body" id="pane-list">
    <div class="bp">
      <div id="maintUpcoming"></div>
      <div class="group-lbl">정비 이력</div>
      <div style="display:flex;flex-direction:column;gap:7px" id="maintList"></div>
    </div>
  </div>

  <nav class="tabbar" id="tabbar"></nav>
</div>

<!-- 정비 수정 모달 -->
<div class="moverlay" id="modal-edit-maint" onclick="if(event.target===this)closeEditMaint()">
  <div class="msheet">
    <div class="m-handle"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div class="m-title" style="margin-bottom:0">🔧 정비 수정</div>
      <button onclick="deleteEditMaint()" style="background:#fef2f2;color:var(--red);border:1.5px solid #fecaca;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;">삭제</button>
    </div>
    <div class="m-body">
      <input type="hidden" id="em_id">
      <div class="m-row">
        <div class="m-group"><label class="m-label">날짜</label><input type="date" class="m-input" id="em_date"></div>
        <div class="m-group"><label class="m-label">주행거리 (km)</label><input type="number" class="m-input" id="em_mileage"></div>
      </div>
      <div class="m-group">
        <label class="m-label">정비 항목</label>
        <select class="m-select" id="em_category">
          <option value="engine_oil">엔진오일 (합성유)</option>
          <option value="engine_oil_basic">엔진오일 (일반유)</option>
          <option value="air_filter">에어클리너</option>
          <option value="cabin_filter">에어컨 필터</option>
          <option value="tire_rotation">타이어 로테이션</option>
          <option value="tire_replace">타이어 교체</option>
          <option value="brake">브레이크 패드</option>
          <option value="coolant">냉각수</option>
          <option value="spark_plug">점화플러그</option>
          <option value="battery">배터리</option>
          <option value="exterior">외관</option>
          <option value="tax">세금/검사</option>
          <option value="other">기타</option>
        </select>
      </div>
      <div class="m-row">
        <div class="m-group"><label class="m-label">금액 (원)</label><input type="number" class="m-input" id="em_amount"></div>
        <div class="m-group"><label class="m-label">정비소</label><input type="text" class="m-input" id="em_shop"></div>
      </div>
      <div class="m-row">
        <div class="m-group"><label class="m-label">다음 예정일</label><input type="date" class="m-input" id="em_next_date"></div>
        <div class="m-group"><label class="m-label">다음 예정 km</label><input type="number" class="m-input" id="em_next_km"></div>
      </div>
      <div class="m-group"><label class="m-label">메모</label><input type="text" class="m-input" id="em_memo"></div>
      <button class="m-btn-primary" onclick="saveMaintEdit()">저장</button>
    </div>
  </div>
</div>

<script src="data.js?v=1"></script>
<script src="nav.js?v=1"></script>
<script>
renderTabBar('maint');
renderVehicleSelect('vsel');
setToday('m_date');

let _maintMonths = 0;
function setPeriod(mo, el) {
  _maintMonths = mo;
  document.querySelectorAll('.pf-btn').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  renderList();
}
function _filtered() {
  const recs = getRecs('maint');
  if (!_maintMonths) return recs;
  const c = new Date(); c.setMonth(c.getMonth() - _maintMonths); c.setDate(1); c.setHours(0,0,0,0);
  return recs.filter(r => new Date(r.date) >= c);
}

renderList();

function switchTab(id, el) {
  document.querySelectorAll('.segtab').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('pane-input').style.display = id === 'input' ? '' : 'none';
  document.getElementById('pane-list').style.display  = id === 'list'  ? '' : 'none';
  document.getElementById('periodBar').style.display  = id === 'list'  ? '' : 'none';
  if (id === 'list') renderList();
}

function calcMaint() {
  const cat = document.getElementById('m_category').value;
  const km  = +document.getElementById('m_mileage').value;
  const d   = document.getElementById('m_date').value;
  const iv  = MAINT_INTERVAL[cat];
  if (iv && d) {
    if (iv.mo) {
      const nd = new Date(d);
      nd.setMonth(nd.getMonth() + iv.mo);
      document.getElementById('m_next_date').value = nd.toISOString().slice(0,10);
    } else {
      document.getElementById('m_next_date').value = '';
    }
    if (iv.km && km) {
      document.getElementById('m_next_km').value = km + iv.km;
    } else {
      document.getElementById('m_next_km').value = '';
    }
  }
}

function saveMaint() {
  const date     = document.getElementById('m_date').value;
  const category = document.getElementById('m_category').value;
  const amount   = +document.getElementById('m_amount').value;
  if (!date || !category || !amount) {
    toast('날짜, 정비 항목, 금액을 입력해주세요');
    return;
  }
  addRec({
    id: DB.uid(), type:'maint',
    date, category, amount,
    mileage:  +document.getElementById('m_mileage').value || 0,
    shop:     document.getElementById('m_shop').value.trim(),
    nextDate: document.getElementById('m_next_date').value,
    nextKm:   +document.getElementById('m_next_km').value || 0,
    memo:     document.getElementById('m_memo').value.trim()
  });
  const maintRecs = getAllRecs(); const newRec = maintRecs[0];
  if (_maintScanData && newRec) ImgDB.set(newRec.id, _maintScanData).catch(()=>{});
  _maintScanData = null;
  document.getElementById('m_receipt_thumb').style.display = 'none';
  document.getElementById('m_scan_status').textContent = '';
  ['m_amount','m_shop','m_memo','m_next_date','m_next_km','m_mileage'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('m_category').value = '';
  toast('정비 기록이 저장됐습니다 ✓');
  switchTab('list', document.querySelectorAll('.segtab')[0]);
}

function renderList() {
  const recs  = _filtered();
  const today = new Date();

  /* 임박 알림 — 필터 무관하게 전체에서 조회 */
  const upcoming = getRecs('maint')
    .filter(r => r.nextDate)
    .map(r => ({ ...r, _days: Math.ceil((new Date(r.nextDate) - today) / 86400000) }))
    .filter(r => r._days < 90)
    .sort((a,b) => a._days - b._days);

  const upEl = document.getElementById('maintUpcoming');
  if (upcoming.length) {
    upEl.innerHTML = `
      <div class="group-lbl">임박 정비 알림</div>
      <div style="display:flex;flex-direction:column;gap:7px;margin-bottom:8px">
        ${upcoming.slice(0,4).map(r => {
          const cls = r._days < 0 ? 'danger' : r._days <= 30 ? 'danger' : r._days <= 60 ? 'warn' : 'ok';
          const lbl = r._days < 0 ? `D+${Math.abs(r._days)} 초과` : `D-${r._days}`;
          return `<div class="upcoming-item ${cls}">
            <span class="d-badge ${cls}">${lbl}</span>
            <div style="flex:1">
              <div style="font-size:13px;font-weight:600;color:var(--t1)">${MAINT_LABEL[r.category]||r.category}</div>
              <div style="font-size:11px;color:var(--t2);margin-top:2px">${r.nextDate}${r.nextKm?' 또는 '+numFmt(r.nextKm)+'km':''}</div>
            </div>
          </div>`;
        }).join('')}
      </div>`;
  } else {
    upEl.innerHTML = '';
  }

  const list = document.getElementById('maintList');
  if (!recs.length) {
    list.innerHTML = `<div class="empty"><span class="empty-ic">🔧</span><div class="empty-t">정비 기록이 없습니다</div></div>`;
    return;
  }
  list.innerHTML = recs.map(r => {
    const days = r.nextDate ? Math.ceil((new Date(r.nextDate) - today) / 86400000) : null;
    const badgeLbl = days != null ? (days < 0 ? '초과' : `D-${days}`) : '완료';
    const badgeCls = days == null ? 'b-other' : days < 0 ? 'b-ins' : days <= 30 ? 'b-ins' : 'b-maint';
    return `<div class="rec-row">
      <span class="rec-badge ${badgeCls}">${badgeLbl}</span>
      <div class="rec-main">
        <div class="rec-title">${MAINT_LABEL[r.category]||r.category}</div>
        <div class="rec-sub">${r.date}${r.shop?' · '+r.shop:''}${r.mileage?' · '+numFmt(r.mileage)+'km':''}${r.nextDate?' · 다음 '+r.nextDate:''}</div>
      </div>
      <span class="rec-amt d-orange">${numFmt(r.amount)}원</span>
      <button class="rec-edit" onclick="openEditMaint('${r.id}')">수정</button>
    </div>`;
  }).join('');
}

function openEditMaint(id) {
  const r = getRecs('maint').find(x => x.id === id); if (!r) return;
  document.getElementById('em_id').value        = id;
  document.getElementById('em_date').value      = r.date;
  document.getElementById('em_mileage').value   = r.mileage   || '';
  document.getElementById('em_category').value  = r.category  || '';
  document.getElementById('em_amount').value    = r.amount    || '';
  document.getElementById('em_shop').value      = r.shop      || '';
  document.getElementById('em_next_date').value = r.nextDate  || '';
  document.getElementById('em_next_km').value   = r.nextKm    || '';
  document.getElementById('em_memo').value      = r.memo      || '';
  document.getElementById('modal-edit-maint').classList.add('show');
}
function closeEditMaint() { document.getElementById('modal-edit-maint').classList.remove('show'); }
function saveMaintEdit() {
  const id = document.getElementById('em_id').value;
  const v  = getV(); if (!v) return;
  const k  = 'recs_' + v.id;
  const recs = DB.get(k, []);
  const idx  = recs.findIndex(x => x.id === id); if (idx < 0) return;
  recs[idx] = { ...recs[idx],
    date:     document.getElementById('em_date').value,
    mileage:  +document.getElementById('em_mileage').value  || 0,
    category: document.getElementById('em_category').value,
    amount:   +document.getElementById('em_amount').value   || 0,
    shop:     document.getElementById('em_shop').value.trim(),
    nextDate: document.getElementById('em_next_date').value,
    nextKm:   +document.getElementById('em_next_km').value  || 0,
    memo:     document.getElementById('em_memo').value.trim()
  };
  DB.set(k, recs);
  closeEditMaint(); renderList(); toast('수정됐습니다 ✓');
}
function deleteEditMaint() {
  confirmDel('이 정비 기록을 삭제할까요?', () => {
    delRec(document.getElementById('em_id').value);
    closeEditMaint(); renderList(); toast('삭제됐습니다');
  });
}

let _maintScanData = null;
async function onMaintScan(e) {
  const file = e.target.files[0]; if (!file) return;
  const st = document.getElementById('m_scan_status');
  st.textContent = '🔍 인식 중...';
  const reader = new FileReader();
  reader.onload = async ev => {
    const dataUrl = ev.target.result;
    _maintScanData = dataUrl;
    document.getElementById('m_receipt_img').src = dataUrl;
    document.getElementById('m_receipt_thumb').style.display = '';
    const result = await ocrReceipt(dataUrl, 'maint');
    e.target.value = '';
    if (!result) { st.textContent = '❌ 인식 실패 — 직접 입력해주세요'; return; }
    if (result.date)   document.getElementById('m_date').value   = result.date;
    if (result.amount) document.getElementById('m_amount').value = result.amount;
    if (result.shop)   document.getElementById('m_shop').value   = result.shop;
    if (result.memo)   document.getElementById('m_memo').value   = result.memo;
    calcMaint();
    st.textContent = '✅ 인식 완료 — 확인 후 저장하세요';
  };
  reader.readAsDataURL(file);
}

function render() {
  renderVehicleSelect('vsel');
  const activeTab = document.querySelector('.segtab.on');
  if (activeTab && activeTab.textContent.includes('현황')) renderList();
}
</script>
</body>
</html>
