<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>기타 — 스마트 차계부</title>
<link rel="stylesheet" href="shared.css?v=4">
</head>
<body>
<div class="page">

  <header class="hdr">
    <span class="hdr-t">💳 기타 지출</span>
    <select class="v-sel-light" id="vsel" onchange="onVehicleChange('vsel')"></select>
  </header>

  <div class="segtabs">
    <button class="segtab on" onclick="switchTab('list',this)">📋 현황</button>
    <button class="segtab"    onclick="switchTab('input',this)">＋ 입력</button>
  </div>
  <div class="period-filter" id="periodBar">
    <button class="pf-btn on" onclick="setPeriod(1,this)">이번달</button>
    <button class="pf-btn" onclick="setPeriod(3,this)">3개월</button>
    <button class="pf-btn" onclick="setPeriod(6,this)">6개월</button>
    <button class="pf-btn" onclick="setPeriod(12,this)">1년</button>
    <button class="pf-btn" onclick="setPeriod(0,this)">전체</button>
  </div>

  <!-- 현황 -->
  <div class="body" id="pane-list">
    <div class="bp">
      <!-- 종류 필터 -->
      <div class="pills" style="border-bottom:none;padding:4px 0 4px;">
        <div class="pill on"  id="pf-all"  onclick="setFilter('all',this)">전체</div>
        <div class="pill"     id="pf-hi"   onclick="setFilter('hipass',this)">⚡ 하이패스</div>
        <div class="pill"     id="pf-ins"  onclick="setFilter('insurance',this)">🛡 보험·세금</div>
        <div class="pill"     id="pf-oth"  onclick="setFilter('other',this)">💸 기타</div>
      </div>

      <!-- 목록 -->
      <div style="display:flex;flex-direction:column;gap:7px" id="etcList"></div>
    </div>
  </div>

  <!-- 입력 -->
  <div class="body" id="pane-input" style="display:none">
    <div class="bp">
      <div class="m-card form">

        <!-- 종류 선택 -->
        <div class="m-group">
          <label class="m-label">종류 *</label>
          <select class="m-select" id="et_type" onchange="onTypeChange()">
            <option value="hipass">⚡ 하이패스 충전</option>
            <option value="insurance">🛡 보험·세금</option>
            <option value="other">💸 기타 지출</option>
          </select>
        </div>

        <!-- 공통: 날짜 / 금액 -->
        <div class="m-row">
          <div class="m-group">
            <label class="m-label">날짜 *</label>
            <input type="date" class="m-input" id="et_date">
          </div>
          <div class="m-group">
            <label class="m-label">금액 (원) *</label>
            <input type="number" class="m-input" id="et_amount" placeholder="30000" oninput="onAmountChange()">
          </div>
        </div>

        <!-- 하이패스 전용 -->
        <div id="fields-hipass">
          <div class="m-row">
            <div class="m-group">
              <label class="m-label">충전 후 잔액 (자동)</label>
              <input type="text" class="m-input auto" id="et_hibalance" readonly placeholder="자동">
            </div>
            <div class="m-group">
              <label class="m-label">충전소</label>
              <input type="text" class="m-input" id="et_hiplace" placeholder="선택 사항">
            </div>
          </div>
        </div>

        <!-- 보험·세금 전용 -->
        <div id="fields-insurance" style="display:none">
          <div class="m-group">
            <label class="m-label">세부 종류</label>
            <select class="m-select" id="et_instype">
              <option value="car_insurance">자동차보험</option>
              <option value="car_tax">자동차세</option>
              <option value="parking">주차비</option>
              <option value="other">기타</option>
            </select>
          </div>
          <div class="m-row">
            <div class="m-group">
              <label class="m-label">만기일</label>
              <input type="date" class="m-input" id="et_expiry">
            </div>
            <div class="m-group">
              <label class="m-label">메모</label>
              <input type="text" class="m-input" id="et_insmemo" placeholder="선택 사항">
            </div>
          </div>
        </div>

        <!-- 기타 전용 -->
        <div id="fields-other" style="display:none">
          <div class="m-group">
            <label class="m-label">내용 *</label>
            <input type="text" class="m-input" id="et_desc" placeholder="예: 세차, 번호판 교체">
          </div>
        </div>

        <button class="m-btn primary" onclick="saveEtc()">저장</button>
      </div>
    </div>
  </div>

  <nav class="tabbar" id="tabbar"></nav>
</div>

<!-- 기타지출 수정 모달 -->
<div class="moverlay" id="modal-edit-etc" onclick="if(event.target===this)closeEditEtc()">
  <div class="msheet">
    <div class="m-handle"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div class="m-title" style="margin-bottom:0" id="ete_title">수정</div>
      <button onclick="deleteEditEtc()" style="background:#fef2f2;color:var(--red);border:1.5px solid #fecaca;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;">삭제</button>
    </div>
    <div class="m-body">
      <input type="hidden" id="ete_id">
      <input type="hidden" id="ete_type">
      <div class="m-row">
        <div class="m-group"><label class="m-label">날짜</label><input type="date" class="m-input" id="ete_date"></div>
        <div class="m-group"><label class="m-label">금액 (원)</label><input type="number" class="m-input" id="ete_amount"></div>
      </div>
      <!-- 하이패스 전용 -->
      <div id="ete-hi">
        <div class="m-group"><label class="m-label">충전소</label><input type="text" class="m-input" id="ete_place"></div>
      </div>
      <!-- 보험·세금 전용 -->
      <div id="ete-ins" style="display:none">
        <div class="m-group"><label class="m-label">세부 종류</label>
          <select class="m-select" id="ete_instype">
            <option value="car_insurance">자동차보험</option><option value="car_tax">자동차세</option>
            <option value="parking">주차비</option><option value="other">기타</option>
          </select>
        </div>
        <div class="m-row">
          <div class="m-group"><label class="m-label">만기일</label><input type="date" class="m-input" id="ete_expiry"></div>
          <div class="m-group"><label class="m-label">메모</label><input type="text" class="m-input" id="ete_memo"></div>
        </div>
      </div>
      <!-- 기타 전용 -->
      <div id="ete-oth" style="display:none">
        <div class="m-group"><label class="m-label">내용</label><input type="text" class="m-input" id="ete_desc"></div>
      </div>
      <button class="m-btn-primary" onclick="saveEtcEdit()">저장</button>
    </div>
  </div>
</div>

<script src="data.js?v=4"></script>
<script src="nav.js?v=4"></script>
<script>
let _etcFilter = 'all';
let _etcMonths = 1;

renderTabBar('etc');
renderVehicleSelect('vsel');
setToday('et_date');
renderList();

function switchTab(id, el) {
  document.querySelectorAll('.segtab').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('pane-list').style.display  = id === 'list'  ? '' : 'none';
  document.getElementById('pane-input').style.display = id === 'input' ? '' : 'none';
  document.getElementById('periodBar').style.display  = id === 'list'  ? '' : 'none';
  if (id === 'list') renderList();
  if (id === 'input') { setToday('et_date'); onTypeChange(); }
}

function setPeriod(mo, el) {
  _etcMonths = mo;
  document.querySelectorAll('.pf-btn').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  renderList();
}

function setFilter(f, el) {
  _etcFilter = f;
  document.querySelectorAll('.pills .pill').forEach(p => p.classList.remove('on'));
  el.classList.add('on');
  renderList();
}

function renderList() {
  const types = ['hipass','insurance','other'];
  let recs = types.flatMap(t => getRecs(t));
  /* 기간 필터 */
  if (_etcMonths) {
    const c = new Date(); c.setMonth(c.getMonth() - _etcMonths); c.setDate(1); c.setHours(0,0,0,0);
    recs = recs.filter(r => new Date(r.date) >= c);
  }
  /* 날짜 내림차순 */
  recs.sort((a,b) => b.date.localeCompare(a.date));
  /* 종류 필터 */
  if (_etcFilter !== 'all') recs = recs.filter(r => r.type === _etcFilter);

  const list = document.getElementById('etcList');
  if (!recs.length) {
    list.innerHTML = `<div class="empty"><span class="empty-ic">💳</span><div class="empty-t">기록이 없습니다</div></div>`;
    return;
  }
  list.innerHTML = recs.map(r => {
    if (r.type === 'hipass') return `
      <div class="rec-row">
        <span class="rec-badge b-hipass">⚡ 하이패스</span>
        <div class="rec-main">
          <div class="rec-title">충전 · ${r.date}${r.place?' · '+r.place:''}</div>
          <div class="rec-sub">+${numFmt(r.amount)}원 → 잔액 ${numFmt(r.balance)}원</div>
        </div>
        <span class="rec-del" style="color:var(--blue)" onclick="openEditEtc('${r.id}','${r.type}')">✏️</span>
      </div>`;
    if (r.type === 'insurance') return `
      <div class="rec-row">
        <span class="rec-badge b-ins">🛡 ${INS_LABEL[r.insType]||r.insType}</span>
        <div class="rec-main">
          <div class="rec-title">${INS_LABEL[r.insType]||r.insType} · ${r.date}</div>
          <div class="rec-sub">${r.expiry?'만기: '+r.expiry+' ':''}${r.memo||''}</div>
        </div>
        <span class="rec-amt d-orange">${numFmt(r.amount)}원</span>
        <span class="rec-del" style="color:var(--blue)" onclick="openEditEtc('${r.id}','${r.type}')">✏️</span>
      </div>`;
    return `
      <div class="rec-row">
        <span class="rec-badge b-other">💸 기타</span>
        <div class="rec-main">
          <div class="rec-title">${r.desc}</div>
          <div class="rec-sub">${r.date}</div>
        </div>
        <span class="rec-amt">${numFmt(r.amount)}원</span>
        <span class="rec-del" style="color:var(--blue)" onclick="openEditEtc('${r.id}','${r.type}')">✏️</span>
      </div>`;
  }).join('');
}

/* ── 입력 ── */
function onTypeChange() {
  const t = document.getElementById('et_type').value;
  document.getElementById('fields-hipass').style.display    = t === 'hipass'    ? '' : 'none';
  document.getElementById('fields-insurance').style.display = t === 'insurance' ? '' : 'none';
  document.getElementById('fields-other').style.display     = t === 'other'     ? '' : 'none';
  if (t === 'hipass') onAmountChange();
}

function onAmountChange() {
  if (document.getElementById('et_type').value !== 'hipass') return;
  const prev = getRecs('hipass');
  const bal  = prev.length ? (prev[0].balance || 0) : 0;
  const add  = +document.getElementById('et_amount').value || 0;
  document.getElementById('et_hibalance').value = add ? numFmt(bal + add) + '원' : '';
}

function saveEtc() {
  const type   = document.getElementById('et_type').value;
  const date   = document.getElementById('et_date').value;
  const amount = +document.getElementById('et_amount').value;
  if (!date || !amount) { toast('날짜와 금액을 입력해주세요'); return; }

  if (type === 'hipass') {
    const prev = getRecs('hipass');
    const bal  = prev.length ? (prev[0].balance || 0) : 0;
    addRec({ id:DB.uid(), type:'hipass', date, amount, balance:bal+amount, place:document.getElementById('et_hiplace').value.trim() });
    document.getElementById('et_hiplace').value = '';
  } else if (type === 'insurance') {
    addRec({ id:DB.uid(), type:'insurance', insType:document.getElementById('et_instype').value, date, amount, expiry:document.getElementById('et_expiry').value, memo:document.getElementById('et_insmemo').value.trim() });
    ['et_expiry','et_insmemo'].forEach(id => document.getElementById(id).value = '');
  } else {
    const desc = document.getElementById('et_desc').value.trim();
    if (!desc) { toast('내용을 입력해주세요'); return; }
    addRec({ id:DB.uid(), type:'other', date, amount, desc });
    document.getElementById('et_desc').value = '';
  }

  document.getElementById('et_amount').value = '';
  document.getElementById('et_hibalance').value = '';
  toast('저장됐습니다 ✓');
  switchTab('list', document.querySelectorAll('.segtab')[0]);
}

function openEditEtc(id, type) {
  const r = getRecs(type).find(x => x.id === id); if (!r) return;
  document.getElementById('ete_id').value    = id;
  document.getElementById('ete_type').value  = type;
  document.getElementById('ete_date').value  = r.date;
  document.getElementById('ete_amount').value = r.amount || '';
  const titles = {hipass:'⚡ 하이패스 충전 수정', insurance:'🛡 보험·세금 수정', other:'💸 기타 지출 수정'};
  document.getElementById('ete_title').textContent = titles[type] || '수정';
  document.getElementById('ete-hi').style.display  = type === 'hipass'    ? '' : 'none';
  document.getElementById('ete-ins').style.display = type === 'insurance' ? '' : 'none';
  document.getElementById('ete-oth').style.display = type === 'other'     ? '' : 'none';
  if (type === 'hipass')    document.getElementById('ete_place').value   = r.place   || '';
  if (type === 'insurance') {
    document.getElementById('ete_instype').value = r.insType || 'car_insurance';
    document.getElementById('ete_expiry').value  = r.expiry  || '';
    document.getElementById('ete_memo').value    = r.memo    || '';
  }
  if (type === 'other') document.getElementById('ete_desc').value = r.desc || '';
  document.getElementById('modal-edit-etc').classList.add('show');
}
function closeEditEtc() { document.getElementById('modal-edit-etc').classList.remove('show'); }
function saveEtcEdit() {
  const id   = document.getElementById('ete_id').value;
  const type = document.getElementById('ete_type').value;
  const v    = getV(); if (!v) return;
  const k    = 'recs_' + v.id;
  const recs = DB.get(k, []);
  const idx  = recs.findIndex(x => x.id === id); if (idx < 0) return;
  recs[idx]  = { ...recs[idx],
    date:   document.getElementById('ete_date').value,
    amount: +document.getElementById('ete_amount').value || 0,
    ...(type==='hipass'    ? {place:   document.getElementById('ete_place').value.trim()} : {}),
    ...(type==='insurance' ? {insType: document.getElementById('ete_instype').value,
                               expiry:  document.getElementById('ete_expiry').value,
                               memo:    document.getElementById('ete_memo').value.trim()} : {}),
    ...(type==='other'     ? {desc:    document.getElementById('ete_desc').value.trim()} : {})
  };
  DB.set(k, recs);
  closeEditEtc(); renderList(); toast('수정됐습니다 ✓');
}
function deleteEditEtc() {
  confirmDel('이 기록을 삭제할까요?', () => {
    delRec(document.getElementById('ete_id').value);
    closeEditEtc(); renderList(); toast('삭제됐습니다');
  });
}

function render() { renderVehicleSelect('vsel'); renderList(); }
</script>
</body>
</html>
