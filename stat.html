<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>통계 — 스마트 차계부</title>
<link rel="stylesheet" href="shared.css?v=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
</head>
<body>
<div class="page">

  <header class="hdr">
    <span class="hdr-t">📊 통계</span>
    <select class="v-sel-light" id="vsel" onchange="onVehicleChange('vsel')"></select>
  </header>

  <div class="period-filter" id="periodFilter">
    <button class="pf-btn on" onclick="setPeriod(1,this)">이번달</button>
    <button class="pf-btn" onclick="setPeriod(3,this)">3개월</button>
    <button class="pf-btn" onclick="setPeriod(6,this)">6개월</button>
    <button class="pf-btn" onclick="setPeriod(12,this)">1년</button>
    <button class="pf-btn" onclick="setPeriod(0,this)">전체</button>
  </div>

  <div class="body">
    <div class="bp">

      <!-- KPI -->
      <div class="kpi-grid" id="statKpi"></div>

      <!-- 월별 지출 -->
      <div class="chart-wrap">
        <div class="chart-title">월별 지출</div>
        <canvas id="chartExpense" height="140"></canvas>
      </div>

      <!-- 항목별 비율 -->
      <div class="chart-wrap">
        <div class="chart-title">항목별 비율</div>
        <canvas id="chartPie" height="160"></canvas>
      </div>

      <!-- 연비 추이 -->
      <div class="chart-wrap">
        <div class="chart-title">연비 추이 (최근 10회)</div>
        <canvas id="chartEffic" height="120"></canvas>
      </div>

      <!-- 월별 운행거리 -->
      <div class="chart-wrap">
        <div class="chart-title">월별 운행거리 (km)</div>
        <canvas id="chartDrive" height="120"></canvas>
      </div>

      <div style="height:4px"></div>
    </div>
  </div>

  <nav class="tabbar" id="tabbar"></nav>
</div>

<script src="data.js?v=1"></script>
<script src="nav.js?v=1"></script>
<script>
Chart.register(ChartDataLabels);
renderTabBar('stat');
renderVehicleSelect('vsel');

let statMonths = 1;
const charts = {};

function setPeriod(mo, el) {
  statMonths = mo;
  document.querySelectorAll('.pf-btn').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  renderStat();
}

function getF(type) {
  const recs = getRecs(type);
  if (!statMonths) return recs;
  const c = new Date();
  c.setMonth(c.getMonth() - statMonths);
  c.setDate(1); c.setHours(0,0,0,0);
  return recs.filter(r => new Date(r.date) >= c);
}

function renderStat() {
  const fuel  = getF('fuel');
  const maint = getF('maint');
  const hi    = getF('hipass');
  const ins   = getF('insurance');
  const oth   = getF('other');
  const drive = getF('drive');

  const fA = fuel.reduce((s,r) => s+r.amount, 0);
  const mA = maint.reduce((s,r) => s+r.amount, 0);
  const hA = hi.reduce((s,r) => s+r.amount, 0);
  const iA = ins.reduce((s,r) => s+r.amount, 0);
  const oA = oth.reduce((s,r) => s+r.amount, 0);
  const tot = fA + mA + hA + iA + oA;
  const td  = drive.reduce((s,r) => s+(r.dist||0), 0);
  const kmc = td ? (tot/td).toFixed(0) : 0;

  document.getElementById('statKpi').innerHTML = `
    <div class="kpi-card">
      <div class="kpi-label">총 지출</div>
      <div class="kpi-value" style="font-size:14px;color:var(--blue)">${numFmt(tot)}<span style="font-size:10px;color:var(--t3)">원</span></div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">총 운행거리</div>
      <div class="kpi-value" style="font-size:14px;color:var(--sky)">${td.toFixed(0)}<span style="font-size:10px;color:var(--t3)">km</span></div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">km당 비용</div>
      <div class="kpi-value" style="font-size:14px;color:var(--orange)">${numFmt(kmc)}<span style="font-size:10px;color:var(--t3)">원</span></div>
    </div>`;

  /* 월별 지출 */
  const mm = {};
  [...fuel.map(r=>({d:r.date,a:r.amount})),
   ...maint.map(r=>({d:r.date,a:r.amount})),
   ...hi.map(r=>({d:r.date,a:r.amount})),
   ...ins.map(r=>({d:r.date,a:r.amount})),
   ...oth.map(r=>({d:r.date,a:r.amount}))
  ].forEach(r => { const mo=r.d.slice(0,7); mm[mo]=(mm[mo]||0)+r.a; });
  const mos = Object.keys(mm).sort().slice(-8);
  mkBar('chartExpense', mos.map(m=>m.slice(5)+'월'), mos.map(m=>mm[m]), 'rgba(37,99,235,.72)');

  /* 파이 */
  const vals  = [fA,mA,hA,iA,oA].filter(v=>v>0);
  const lbls  = ['주유비','정비비','하이패스','보험세금','기타'].filter((_,i)=>[fA,mA,hA,iA,oA][i]>0);
  mkPie('chartPie', lbls, vals);

  /* 연비 추이 */
  const ef = getF('fuel').filter(r=>r.effic>0).slice(-10).reverse();
  mkLine('chartEffic', ef.map(r=>r.date.slice(5)), ef.map(r=>r.effic), 'rgba(22,163,74,.85)');

  /* 월별 운행거리 */
  const dm = {};
  drive.forEach(r => { const mo=r.date.slice(0,7); dm[mo]=(dm[mo]||0)+(r.dist||0); });
  const dms = Object.keys(dm).sort().slice(-8);
  mkBar('chartDrive', dms.map(m=>m.slice(5)+'월'), dms.map(m=>dm[m]), 'rgba(14,165,233,.72)', 'km');
}

/* 1만 단위 축약 */
function _fmt(v) { return v >= 100000 ? Math.round(v/10000)+'만' : v >= 10000 ? (v/10000).toFixed(1)+'만' : numFmt(v); }

function mkBar(id, labels, data, color, unit='원') {
  if (charts[id]) charts[id].destroy();
  const ctx = document.getElementById(id); if (!ctx) return;
  charts[id] = new Chart(ctx, {
    type:'bar',
    data:{ labels, datasets:[{ data, backgroundColor:color, borderRadius:5, clip:false }] },
    options:{
      plugins:{
        legend:{ display:false },
        datalabels:{
          anchor:'end', align:'top', clamp:false,
          formatter: v => v > 0 ? (unit==='원' ? _fmt(v) : numFmt(Math.round(v))) : '',
          font:{ size:9, weight:'700' },
          color:'#475569'
        }
      },
      scales:{ x:{ticks:{font:{size:10}}}, y:{ticks:{font:{size:10}}, grace:'20%'} },
      responsive:true,
      layout:{ padding:{ top:20 } }
    }
  });
}

function mkLine(id, labels, data, color) {
  if (charts[id]) charts[id].destroy();
  const ctx = document.getElementById(id); if (!ctx) return;
  charts[id] = new Chart(ctx, {
    type:'line',
    data:{ labels, datasets:[{ data, borderColor:color, backgroundColor:color.replace('.85','.1'), borderWidth:2.5, tension:.35, fill:true, pointRadius:4 }] },
    options:{
      plugins:{
        legend:{ display:false },
        datalabels:{
          anchor:'center', align:'top', offset:6,
          formatter: v => v > 0 ? v.toFixed(1) : '',
          font:{ size:9, weight:'700' },
          color: color.replace('.85','1')
        }
      },
      scales:{ x:{ticks:{font:{size:10}}}, y:{ticks:{font:{size:10}}} },
      responsive:true,
      layout:{ padding:{ top:10 } }
    }
  });
}

function mkPie(id, labels, data) {
  if (charts[id]) charts[id].destroy();
  const ctx = document.getElementById(id); if (!ctx) return;
  const total = data.reduce((a,b)=>a+b, 0);
  charts[id] = new Chart(ctx, {
    type:'doughnut',
    data:{ labels, datasets:[{ data, backgroundColor:['rgba(37,99,235,.85)','rgba(217,119,6,.85)','rgba(124,58,237,.85)','rgba(220,38,38,.85)','rgba(100,116,139,.85)'].slice(0,data.length), borderWidth:2 }] },
    options:{
      plugins:{
        legend:{ position:'right', labels:{ font:{size:11} } },
        datalabels:{
          formatter:(v, ctx2) => {
            const pct = total ? Math.round(v/total*100) : 0;
            return pct >= 5 ? pct+'%\n'+_fmt(v) : '';
          },
          color:'#fff',
          font:{ size:10, weight:'700' },
          textAlign:'center'
        }
      },
      responsive:true
    }
  });
}

function render() {
  renderVehicleSelect('vsel');
  renderStat();
}

renderStat();
</script>
</body>
</html>
